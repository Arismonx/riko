name: CI

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"

  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run linter
        run: bun biome ci

      # - name: Run tests
      #   run: bun test

      - name: Run build
        run: bun run build
